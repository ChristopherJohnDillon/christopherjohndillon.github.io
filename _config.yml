# theme: jekyll-theme-minimal
# Site settings
markdown: kramdown
# {% raw %}{% seo %}{% endraw %}
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Internal planning/dev docs and scripts — kept in git but never rendered or
# published. Excluding docs/ also prevents GitHub Pages' optional-front-matter
# plugin from parsing the Liquid code examples inside the spec/plan markdown.
exclude:
  - docs/
  - scripts/
  - Gemfile
  - Gemfile.lock
  - Makefile
  - makesite.sh
  - vendor
  - node_modules



url: "https://christopherdillon.me" # the base hostname & protocol for your site

# Render posts even if their frontmatter date is ahead of the build
# clock — dodges timezone / scheduling surprises.
future: true

# Post permalinks only — scoped via defaults so page .html files keep
# their default file-path URLs (e.g. /pascal/privacy.html stays intact).
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:year/:month/:day/:title/

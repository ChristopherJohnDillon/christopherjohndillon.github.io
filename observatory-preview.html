const Nanoflare = ({ size = 48, color = "var(--nanoflare)", noise = "var(--instrument)" }) => {
  const w = 48, h = 48, base = 30, peakX = 18, peakY = 6, tau = 6, riseX = 16.5;
  const pts = [[2, base], [riseX, base], [peakX, peakY]];
  for (let x = peakX + 0.5; x <= 46; x += 0.5)
    pts.push([x, +(base - (base - peakY) * Math.exp(-(x - peakX) / tau)).toFixed(2)]);
  const flarePath = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p[0]} ${p[1]}`).join(" ");
  const fillPath  = flarePath + ` L 46 ${base} L 2 ${base} Z`;
  const noiseSeg = (x1, x2) => {
    const segs = []; let x = x1;
    while (x < x2) { const nx = Math.min(x2, x + 1.6); const j = ((x*7)%3)-1;
      segs.push(`M ${x} ${base+j*0.3} L ${nx} ${base+((nx*7)%3-1)*0.3}`); x = nx; }
    return segs.join(" ");
  };
  return (
    <svg width={size} height={size} viewBox={`0 0 ${w} ${h}`} aria-label="Dillon nanoflare mark">
      <path d={noiseSeg(2, riseX)} stroke={noise} strokeWidth="1" fill="none" opacity="0.85"/>
      <path d={fillPath} fill={color} fillOpacity="0.14"/>
      <path d={flarePath} stroke={color} strokeWidth="1.75" fill="none" strokeLinejoin="round" strokeLinecap="round"/>
      <circle cx={peakX} cy={peakY} r="1.6" fill={color}/>
      <circle cx={peakX} cy={peakY} r="4" fill="none" stroke={color} strokeOpacity="0.35"/>
      <line x1="2" y1="36" x2="46" y2="36" stroke="var(--rule-strong)" strokeWidth="0.5"/>
    </svg>
  );
};

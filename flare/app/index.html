title: FLARE — App
sitemap: false
robots: noindex, nofollow
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F.L.A.R.E</title>
  <link rel="stylesheet" href="{{ '/flare/flare.css' | relative_url }}" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-shell" id="appShell">

    <nav class="sidebar" aria-label="Navigation">

      <div class="sb-header">
        <a class="flare-wordmark" href="#/home">
          <img class="glyph" src="{{ '/flare/flare-logo.svg' | relative_url }}" alt="" />
          <span>F.L.A.R.E</span>
        </a>
        <button class="sb-toggle" id="sbToggle" aria-label="Toggle sidebar" title="Toggle sidebar">
          <span class="ms ms-sm">menu_open</span>
        </button>
      </div>

      <div class="sb-body" id="sbBody">
        <!-- Populated by flare-app.js -->
      </div>

      <div class="sb-foot">
        <div class="accent">VISUAL CLONE · v1.1</div>
        Static demo · not the real Streamlit stack.<br/>
        <a href="{{ '/flare/' | relative_url }}" style="color: var(--mute); border-bottom: 1px dotted var(--mute);">About this demo</a>
      </div>
    </nav>

    <header class="topbar">
      <div class="crumbs">
        <span>FLARE</span>
        <span class="sep">/</span>
        <span class="current" id="crumbSection">Home</span>
      </div>
      <div class="right">
        <div class="business-switcher" id="bizSwitcher" role="button" tabindex="0" aria-haspopup="true">
          <span class="swatch" id="bizSwatch"></span>
          <span id="bizLabel">Group rollup</span>
          <span class="ms ms-sm">expand_more</span>
          <div class="switcher-menu" id="bizMenu" role="menu"></div>
        </div>
        <span class="user-badge">
          <span class="avatar">CD</span>
          <span>demo@flare.ops</span>
        </span>
      </div>
    </header>

    <main class="main" id="main" aria-live="polite"></main>
  </div>

  <div class="flare-tooltip" id="flareTooltip"></div>

  <script src="{{ '/flare/flare-data.js' | relative_url }}"></script>
  <script src="{{ '/flare/flare-charts.js' | relative_url }}"></script>
  <script src="{{ '/flare/dashboards/home.js' | relative_url }}"></script>
  <script src="{{ '/flare/dashboards/exec.js' | relative_url }}"></script>
  <script src="{{ '/flare/dashboards/sku.js' | relative_url }}"></script>
  <script src="{{ '/flare/dashboards/stats.js' | relative_url }}"></script>
  <script src="{{ '/flare/dashboards/warehouse.js' | relative_url }}"></script>
  <script src="{{ '/flare/dashboards/otif.js' | relative_url }}"></script>
  <script src="{{ '/flare/dashboards/bundle.js' | relative_url }}"></script>
  <script src="{{ '/flare/dashboards/nps.js' | relative_url }}"></script>
  <script src="{{ '/flare/flare-app.js' | relative_url }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — FLARE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="{{ '/flare/flare.css' | relative_url }}" />
  {% include analytics.html %}
</head>
<body>
  <div class="login-bg">
    <div class="login-card">

      <div class="top">
        <a class="flare-wordmark" href="{{ '/flare/' | relative_url }}">
          <img class="glyph" src="{{ '/flare/flare-logo.svg' | relative_url }}" alt="" />
          <span>F.L.A.R.E</span>
        </a>
        <span class="demo-chip">DEMO</span>
      </div>

      <h2>Sign in to FLARE</h2>
      <div class="sub">Helios Brands Co. tenant · helios.flare.ops</div>

      <label for="email">Work account</label>
      <input type="email" id="email" value="demo@flare.ops" readonly />

      <button class="ms-button" id="signin">
        <span class="ms-logo" aria-hidden="true"></span>
        <span>Sign in with Microsoft</span>
      </button>

      <div class="alt-sso">or single sign-on via your tenant</div>

      <button style="width:100%;padding:0.7rem;background:transparent;border:1px solid var(--rule-strong);color:var(--read);border-radius:4px;cursor:pointer;font-family:inherit;" id="signin-alt">Continue with Entra ID</button>

      <div class="disclaimer">
        Static demo — no real authentication.<br />
        <a href="{{ '/flare/' | relative_url }}">Back to overview</a>
      </div>
    </div>
  </div>

  <script>
    function go() { window.location.href = "{{ '/flare/app/' | relative_url }}"; }
    document.getElementById('signin').addEventListener('click', go);
    document.getElementById('signin-alt').addEventListener('click', go);
  </script>
</body>
</html>

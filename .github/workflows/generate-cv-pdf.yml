name: Generate CV PDF

on:
  # Run after Pages deployment completes
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    # Only run if Pages succeeded (or manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Wait for deployment to propagate
        run: sleep 120

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Generate PDF
        run: python scripts/generate_cv_pdf.py

      - name: Upload PDF to cv-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view cv-latest > /dev/null 2>&1; then
            gh release upload cv-latest cv/Christopher_Dillon.pdf --clobber
          else
            gh release create cv-latest cv/Christopher_Dillon.pdf \
              --title "Latest CV PDF" \
              --notes "Auto-generated on every Pages deployment. Always reflects the current /cv/ page."
          fi

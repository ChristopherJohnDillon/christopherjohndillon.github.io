name: Generate CV PDF

on:
  # Disabled automatic trigger - run manually or locally with: make pdf
  # workflow_run:
  #   workflows: ["pages-build-deployment"]
  #   types:
  #     - completed
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Generate PDF
        run: python scripts/generate_cv_pdf.py

      - name: Check for changes
        id: check
        run: |
          git diff --quiet cv/Christopher_Dillon.pdf || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push PDF
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cv/Christopher_Dillon.pdf
          git commit -m "Update CV PDF [skip ci]"
          git push

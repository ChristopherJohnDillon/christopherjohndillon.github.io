<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>{{ page.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: 'Portfolio of Dr. Chris Dillon – Global Lead Data Scientist at Nexus Brands Group.' }}" />
    <meta name="author" content="Christopher Dillon" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ page.title | escape }}" />
    <meta property="og:description" content="{{ page.description | default: 'Portfolio of Dr. Chris Dillon – Global Lead Data Scientist at Nexus Brands Group.' }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:site_name" content="Christopher Dillon" />
    <meta property="og:image" content="{{ '/images/circle_me.png' | absolute_url }}" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{ page.title | escape }}" />
    <meta name="twitter:description" content="{{ page.description | default: 'Portfolio of Dr. Chris Dillon – Global Lead Data Scientist at Nexus Brands Group.' }}" />
    <meta name="twitter:image" content="{{ '/images/circle_me.png' | absolute_url }}" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Christopher Dillon",
      "jobTitle": "Global Lead Data Scientist",
      "url": "{{ '/' | absolute_url }}",
      "image": "{{ '/images/circle_me.png' | absolute_url }}",
      "sameAs": [
        "https://github.com/ChristopherJohnDillon",
        "https://www.linkedin.com/in/drchrisdillon/",
        "https://mastodon.ie/@DrChris"
      ],
      "worksFor": {
        "@type": "Organization",
        "name": "Nexus Brands Group"
      }
    }
    </script>

    <!-- Favicon + Styles -->
    <link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}?v=2" />
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
  </head>

  <body>
    <div class="container">
      <nav>
        <ul>
          <li><a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="active"{% endif %}>Home</a></li>
          <li><a href="{{ '/about' | relative_url }}"{% if page.url contains "/about" %} class="active"{% endif %}>About</a></li>
          <li><a href="{{ '/pascal' | relative_url }}"{% if page.url contains "/pascal" %} class="active"{% endif %}>Pascal</a></li>
          <li><a href="https://www.linkedin.com/in/drchrisdillon/">LinkedIn</a></li>
          <li><a href="{{ '/cv/' | relative_url }}">CV</a></li>
        </ul>
      </nav>

      {{ content }}

      <footer>
        <span>2026 Christopher Dillon</span>
        <span>Northern Ireland</span>
      </footer>
    </div>
  </body>
</html>

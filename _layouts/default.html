<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{ page.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: 'Portfolio of Dr. Chris Dillon – Global Lead Data Scientist at Nexus Brands Group.' }}" />
    <meta name="author" content="Christopher Dillon" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ page.title | escape }}" />
    <meta property="og:description" content="{{ page.description | default: 'Portfolio of Dr. Chris Dillon – Global Lead Data Scientist at Nexus Brands Group.' }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:site_name" content="Christopher Dillon" />
    <meta property="og:image" content="{{ '/images/circle_me.png' | absolute_url }}" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{ page.title | escape }}" />
    <meta name="twitter:description" content="{{ page.description | default: 'Portfolio of Dr. Chris Dillon – Global Lead Data Scientist at Nexus Brands Group.' }}" />
    <meta name="twitter:image" content="{{ '/images/circle_me.png' | absolute_url }}" />

    <!-- Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Christopher Dillon",
      "jobTitle": "Global Lead Data Scientist",
      "url": "{{ '/' | absolute_url }}",
      "image": "{{ '/images/circle_me.png' | absolute_url }}",
      "sameAs": [
        "https://github.com/ChristopherJohnDillon",
        "https://www.linkedin.com/in/drchrisdillon/",
        "https://mastodon.ie/@DrChris"
      ],
      "worksFor": {
        "@type": "Organization",
        "name": "Nexus Brands Group"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Favicon + Styles -->
    <link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}?v=2" />
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
  </head>

  <body>
    <div class="starfield"></div>
    <div class="site-bg">
      <div class="container">
        <nav>
          <a href="{{ '/' | absolute_url }}" class="nav-mark" aria-label="Home">
            <svg width="28" height="28" viewBox="0 0 48 48" id="nanoflare-nav"></svg>
          </a>
          <ul>
            <li><a href="{{ '/' | absolute_url }}"{% if page.url == "/" %} class="active"{% endif %}>Home</a></li>
            <li><a href="{{ '/about' | absolute_url }}"{% if page.url contains "/about" %} class="active"{% endif %}>About</a></li>
            <li><a href="{{ '/pascal' | absolute_url }}"{% if page.url contains "/pascal" %} class="active"{% endif %}>Pascal</a></li>
            <li><a href="https://www.linkedin.com/in/drchrisdillon/">LinkedIn</a></li>
            <li><a href="{{ '/cv/' | absolute_url }}">CV</a></li>
          </ul>
        </nav>

        {{ content }}

        <footer>
          <span>&sigma; &middot; 2025 Christopher Dillon</span>
          <span>Northern Ireland</span>
        </footer>
      </div>
    </div>
    <script>
    (function(){
      var b=30,px=18,py=6,tau=6,rx=16.5,pts=[[2,b],[rx,b],[px,py]];
      for(var x=px+.5;x<=46;x+=.5)pts.push([x,+(b-(b-py)*Math.exp(-(x-px)/tau)).toFixed(2)]);
      var fp=pts.map(function(p,i){return(i?'L':'M')+' '+p[0]+' '+p[1]}).join(' ');
      var fl=fp+' L 46 '+b+' L 2 '+b+' Z',ns='',nx,j;
      for(x=2;x<rx;){nx=Math.min(rx,x+1.6);j=((x*7)%3)-1;
        ns+='M '+x+' '+(b+j*.3)+' L '+nx+' '+(b+((nx*7)%3-1)*.3)+' ';x=nx;}
      var s=document.getElementById('nanoflare-nav');if(!s)return;
      s.innerHTML='<path d="'+ns+'" stroke="#E8ECF2" stroke-width="1" fill="none" opacity=".85"/>'
        +'<path d="'+fl+'" fill="#FF4F00" fill-opacity=".14"/>'
        +'<path d="'+fp+'" stroke="#FF4F00" stroke-width="1.75" fill="none" stroke-linejoin="round" stroke-linecap="round"/>'
        +'<circle cx="'+px+'" cy="'+py+'" r="1.6" fill="#FF4F00"/>'
        +'<circle cx="'+px+'" cy="'+py+'" r="4" fill="none" stroke="#FF4F00" stroke-opacity=".35"/>'
        +'<line x1="2" y1="36" x2="46" y2="36" stroke="rgba(232,236,242,.18)" stroke-width=".5"/>';
    })();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{ page.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: 'Portfolio of Dr. Chris Dillon – Global Lead Data Scientist at Nexus Brands Group.' }}" />
    <meta name="author" content="Christopher Dillon" />
    <meta name="robots" content="{{ page.robots | default: 'index, follow' }}" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ page.title | escape }}" />
    <meta property="og:description" content="{{ page.description | default: 'Portfolio of Dr. Chris Dillon – Global Lead Data Scientist at Nexus Brands Group.' }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:site_name" content="Christopher Dillon" />
    <meta property="og:image" content="{{ '/images/og-image.png' | absolute_url }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ page.title | escape }}" />
    <meta name="twitter:description" content="{{ page.description | default: 'Portfolio of Dr. Chris Dillon – Global Lead Data Scientist at Nexus Brands Group.' }}" />
    <meta name="twitter:image" content="{{ '/images/og-image.png' | absolute_url }}" />

    <!-- Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Christopher Dillon",
      "jobTitle": "Global Lead Data Scientist",
      "url": "{{ '/' | absolute_url }}",
      "image": "{{ '/images/circle_me.png' | absolute_url }}",
      "sameAs": [
        "https://github.com/ChristopherJohnDillon",
        "https://www.linkedin.com/in/drchrisdillon/",
        "https://mastodon.ie/@DrChris"
      ],
      "worksFor": {
        "@type": "Organization",
        "name": "Nexus Brands Group"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Favicon + Styles -->
    <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}?v=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}?v=3" />
    <link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}?v=3" />
    <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}?v=3" />
    <meta name="theme-color" content="#0B0F1A" />
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
  </head>

  <body>
    <div class="starfield"></div>
    <div class="site-bg">
      <div class="container">
        <nav>
          <ul>
            <li><a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="active"{% endif %}>Home</a></li>
            <li><a href="{{ '/about' | relative_url }}"{% if page.url contains "/about" %} class="active"{% endif %}>About</a></li>
            <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains "/blog" %} class="active"{% endif %}>Blog</a></li>
            <li><a href="{{ '/pascal' | relative_url }}"{% if page.url contains "/pascal" %} class="active"{% endif %}>Pascal</a></li>
            <li><a href="{{ '/nyquist' | relative_url }}"{% if page.url contains "/nyquist" %} class="active"{% endif %}>Nyquist</a></li>
            <li><a href="https://www.linkedin.com/in/drchrisdillon/">LinkedIn</a></li>
            <li><a href="{{ '/cv/' | relative_url }}">CV</a></li>
          </ul>
        </nav>

        {{ content }}

        <footer>
          <span>&sigma; &middot; 2026 Christopher Dillon</span>
          <span>Northern Ireland</span>
        </footer>
      </div>
    </div>
    <script src="{{ '/assets/js/flare.js' | relative_url }}"></script>
  </body>
</html>

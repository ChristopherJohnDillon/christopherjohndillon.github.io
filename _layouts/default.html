<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>{{ page.title | escape }} | Christopher Dillon</title>
    <meta name="description" content="{{ page.description | default: 'Portfolio of Dr. Chris Dillon – Global Lead Data Scientist at Nexus Brands Group. View experience, publications, and education history.' }}" />
    <meta name="author" content="Christopher Dillon" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ page.title | escape }} | Christopher Dillon" />
    <meta property="og:description" content="{{ page.description | default: 'Portfolio of Dr. Chris Dillon – Global Lead Data Scientist at Nexus Brands Group.' }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:site_name" content="Chris Dillon" />
    <meta property="og:image" content="{{ '/images/circle_me.png' | absolute_url }}" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ page.title | escape }} | Christopher Dillon" />
    <meta name="twitter:description" content="{{ page.description | default: 'Portfolio of Dr. Chris Dillon – Global Lead Data Scientist at Nexus Brands Group.' }}" />
    <meta name="twitter:image" content="{{ '/images/circle_me.png' | absolute_url }}" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Christopher Dillon",
      "jobTitle": "Global Lead Data Scientist",
      "url": "{{ '/' | absolute_url }}",
      "image": "{{ '/images/circle_me.png' | absolute_url }}",
      "sameAs": [
        "https://github.com/ChristopherJohnDillon",
        "https://www.linkedin.com/in/drchrisdillon/",
        "https://mastodon.ie/@DrChris"
      ],
      "worksFor": {
        "@type": "Organization",
        "name": "Nexus Brands Group"
      }
    }
    </script>

    <!-- Favicon + Styles -->
<!--     <link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | absolute_url }}" />
    <link rel="stylesheet" type="text/css" href="{{ '/css/main.css' | absolute_url }}" /> -->


    <!-- Favicon + Styles -->
<link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}" />
<link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">

    
  </head>

  <body>
    <header>
      <a style="display: inline;" href="{{ '/' | absolute_url }}">
        <img
          style="width: 80px; height: 80px; border-radius: 80px;"
          src="{{ '/images/circle_me.png' | absolute_url }}"
          alt="A photograph of Christopher Dillon, wearing a blue shirt"
        />
      </a>

      <h1>Dr Chris Dillon</h1>

      <nav>
        <ul>
          <li><a href="{{ '/' | absolute_url }}">Home</a></li>
          <li><a href="{{ '/about' | absolute_url }}">About</a></li>
          <li><a href="https://www.linkedin.com/in/drchrisdillon/">LinkedIn</a></li>
          <li><a href="{{ '/cv/Christopher_Dillon.pdf' | absolute_url }}">CV</a></li>
        </ul>
      </nav>
    </header>

    <div class="container">
      {{ content }}
    </div>



    <footer class="site-footer">
  <style>
    footer.site-footer{width:100%;background:#1f2d36;color:#fff}
    footer.site-footer .container{max-width:none;width:100%;margin:0;padding:2rem 0;border:0;background:none;box-shadow:none}
    footer.site-footer .footer-inner{max-width:1200px;margin:0 auto;padding:0 1rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem}
    footer.site-footer ul{list-style:none;margin:0;padding:0}
    footer.site-footer li{margin:0.25rem 0}
    footer.site-footer a{color:#fff;text-decoration:underline}
    footer.site-footer .copy{margin:0;opacity:.9}
    @media (max-width:700px){footer.site-footer .footer-inner{flex-direction:column;align-items:flex-start}}
  </style>
  <div class="container">
    <div class="footer-inner">
      <ul>
        <li><strong>Contact</strong></li>
        <li>Email: <a href="mailto:mail@christopherdillon.me">mail@christopherdillon.me</a></li>
        <li>GitHub: <a href="https://github.com/ChristopherJohnDillon">ChristopherJohnDillon</a></li>
        <li>LinkedIn: <a href="https://www.linkedin.com/in/drchrisdillon/">drchrisdillon</a></li>
        <li>Mastodon: <a rel="me" href="https://mastodon.ie/@DrChris">@DrChris</a></li>
      </ul>
      <p class="copy">© 2025 Christopher Dillon</p>
    </div>
  </div>
</footer>

    
  </body>
</html>
